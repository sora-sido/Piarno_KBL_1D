/* Layout: 上に曲の情報と区切りの小節一覧、下に白い紙の五線譜（テーマに関わらず紙は白）。アプリのドキュメント群と同じ書体・配色 */
:root {
  --page: #eef0f3; --canvas: #ffffff; --ink: #1b2330; --muted: #5d6676; --faint: #d9dde3; --soft: #f3f4f7; --accent: #0f8fa6;
  --paper: #ffffff; --paper-ink: #111111;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0f1319; --canvas: #171c24; --ink: #e8ecf2; --muted: #9aa4b4; --faint: #2c3440; --soft: #212834; --accent: #3cc6dd; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #0f1319; --canvas: #171c24; --ink: #e8ecf2; --muted: #9aa4b4; --faint: #2c3440; --soft: #212834; --accent: #3cc6dd; color-scheme: dark; }
body { background: var(--page); color: var(--ink); font-family: var(--font-body); }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.sheet { background: var(--canvas); border-radius: 4px; padding: clamp(16px, 2.6vw, 28px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.sheet > * { min-width: 0; }
h1 { margin: 0; font-size: clamp(1.35rem, 2.4vw, 1.75rem); font-weight: 600; }
.meta { margin: 6px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.7; }
.meta b { color: var(--ink); font-weight: 600; }
.sections { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.sections button { font: inherit; font-size: .82rem; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--faint); background: var(--soft); color: var(--ink); cursor: pointer; }
.sections button span { font-family: var(--font-mono); color: var(--muted); margin-left: 6px; font-size: .76rem; }
.sections button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.how { margin: 0; font-size: .86rem; line-height: 1.7; color: var(--muted); border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--soft); border-radius: 0 6px 6px 0; }
.how b { color: var(--ink); }
.paper { background: var(--paper); color: var(--paper-ink); border-radius: 4px; border: 1px solid var(--faint); padding: 8px 4px; overflow-x: auto; }
#score { min-height: 200px; }
.status { color: var(--muted); font-size: .85rem; padding: 12px; }
</style>

<div class="wrap">
  <div class="sheet">
    <header>
      <h1>新宝島（右手メロディ）</h1>
      <p class="meta">アプリが読み込んでいる楽譜ファイル <b>songs/shin_takarajima.musicxml</b> をそのまま表示しています。<b id="size">…</b>、調号 ♭2 つ、前奏 ♩=149／Aメロ以降 ♩=156。<b>音符の下の数字が指番号</b>、各小節の左上の数字が小節番号です。</p>
    </header>
    <ul class="sections" id="sections" aria-label="区切りへ移動"></ul>
    <p class="how">直したいところは、<b>小節番号（各小節の左上の数字）と拍</b>で教えてください。例：「25 小節目の 3 拍目のレをミに」「前奏の 5 小節目の 2 つ目の音を半拍短く」。指番号の変更も同じように指定できます。</p>
    <div class="paper"><div id="score"><div class="status">楽譜を描いています…</div></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script>
const xml = document.getElementById("musicxml").textContent.trim();
// 区切り（練習番号）と小節数・打鍵数は楽譜ファイルから数える（曲を直しても番号がずれないように）
const doc = new DOMParser().parseFromString(xml, "application/xml");
const measures = [...doc.getElementsByTagName("measure")];
const SECTIONS = [];
measures.forEach((m) => {
  const r = m.getElementsByTagName("rehearsal")[0];
  const no = Number(m.getAttribute("number"));
  if (r) { if (SECTIONS.length) SECTIONS[SECTIONS.length - 1][2] = no - 1; SECTIONS.push([r.textContent.trim(), no, no]); }
});
if (SECTIONS.length) SECTIONS[SECTIONS.length - 1][2] = Number(measures[measures.length - 1].getAttribute("number"));
const taps = [...doc.getElementsByTagName("note")].filter((n) => !n.getElementsByTagName("rest").length &&
  ![...n.getElementsByTagName("tie")].some((t) => t.getAttribute("type") === "stop")).length;
document.getElementById("size").textContent = `${measures.length} 小節・${taps} 打鍵`;
document.getElementById("sections").innerHTML = SECTIONS.map(([n, a, b]) =>
  `<li><button type="button" data-m="${a}">${n}<span>${a}–${b}</span></button></li>`).join("");

const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("score", {
  autoResize: true,
  backend: "svg",
  drawTitle: false,
  drawPartNames: false,
  drawMeasureNumbers: true,
  measureNumberInterval: 1,
  drawFingerings: true,
  fingeringPosition: "below",
  pageFormat: "Endless"
});
osmd.EngravingRules.RenderMeasureNumbersOnlyAtSystemStart = false;
osmd.load(xml).then(() => {
  osmd.render();
  document.querySelectorAll("#sections button").forEach((btn) => btn.addEventListener("click", () => {
    const m = Number(btn.dataset.m);
    const gm = osmd.GraphicSheet.MeasureList[m - 1] && osmd.GraphicSheet.MeasureList[m - 1][0];
    const svg = document.querySelector("#score svg");
    if (!gm || !svg) return;
    const unit = 10 * (osmd.zoom || 1);
    const y = gm.PositionAndShape.AbsolutePosition.y * unit;
    const top = svg.getBoundingClientRect().top + window.scrollY + y - 80;
    window.scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));
}).catch((e) => {
  document.getElementById("score").innerHTML = `<div class="status">楽譜を表示できませんでした：${String(e).replace(/</g, "&lt;")}</div>`;
});
</script>
